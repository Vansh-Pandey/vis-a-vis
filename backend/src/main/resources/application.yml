# Settings that differ per environment come from environment variables (see README).
# No secret has a default here: the app refuses to start without them.
spring:
  application:
    name: vinsight-api
  datasource:
    url: ${VINSIGHT_DB_URL:jdbc:mariadb://localhost:3306/vinsight_dev}
    username: ${VINSIGHT_DB_APP_USER:vinsight_app}
    password: ${VINSIGHT_DB_APP_PASSWORD}
    hikari:
      maximum-pool-size: 10
  flyway:
    url: ${spring.datasource.url}
    user: ${VINSIGHT_DB_MIGRATOR_USER:vinsight_migrator}
    password: ${VINSIGHT_DB_MIGRATOR_PASSWORD}
    clean-disabled: true
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */5 * * * *"
  mail:
    host: ${VINSIGHT_SMTP_HOST:}
    port: ${VINSIGHT_SMTP_PORT:587}
    username: ${VINSIGHT_SMTP_USER:}
    password: ${VINSIGHT_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: always

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-exception: false
  servlet:
    session:
      cookie:
        name: VSID
        http-only: true
        secure: ${VINSIGHT_SECURE_COOKIES:true}
        same-site: strict
        path: /
  tomcat:
    max-http-form-post-size: 256KB
    max-swallow-size: 2MB
  forward-headers-strategy: ${VINSIGHT_FORWARD_HEADERS:none}

vinsight:
  # Address the site is served from. Requests that change data must come from here (Origin check).
  site-origin: ${VINSIGHT_SITE_ORIGIN:http://localhost:3000}
  # 32-byte key (base64) for signing CAPTCHA ids and encrypting admin two-step secrets.
  secret-key: ${VINSIGHT_SECRET_KEY}
  # STAGING / PRODUCTION / DEV. Anything but PRODUCTION may return reset links in API responses for testing.
  environment: ${VINSIGHT_ENV:PRODUCTION}
  mail-from: ${VINSIGHT_MAIL_FROM:info@vinsight.jp}
  admin:
    allowed-ips: ${VINSIGHT_ADMIN_ALLOWED_IPS:}
    session-idle-minutes: 15
  member:
    session-idle-minutes: 30
  staging-gate:
    # Basic-auth gate for the whole staging site (meeting 2 Nov: staging must not be open to the public or search engines)
    user: ${VINSIGHT_STAGING_USER:}
    password: ${VINSIGHT_STAGING_PASSWORD:}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
